career-profile:
    title: About Me
    summary: |
      With over 20 years of IT experience and having started my own business at the age of 16, I have developed solid technical and leadership skills. In roles such as Lead Support Manager at akoro.de or Head of IT Operations at Meinestadt.de, I have built teams and optimized processes. My systemic training has deepened my leadership qualities and given me insights into organizational structures. My commitment and entrepreneurial spirit make me well-suited for leading IT positions.


